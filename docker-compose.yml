services:
  web:
    build: .
    container_name: angelswert_web
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./:/app

  db:
    image: postgres:16
    container_name: angelswert_db
    environment:
      POSTGRES_USER: angel
      POSTGRES_PASSWORD: angelpass
      POSTGRES_DB: angelswert
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
