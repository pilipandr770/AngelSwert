databases:
  - name: angelswert-db
    databaseName: angelswert
    user: angelswert

services:
  - type: web
    name: angelswert-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: angelswert-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BLOG_AI_MODEL
        value: gpt-4.1-mini
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENABLE_BLOG_SCHEDULER
        value: "true"
      - key: S3_UPLOADS_ENABLED
        value: "true"
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: S3_KEY_PREFIX
        value: "angelswert"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
